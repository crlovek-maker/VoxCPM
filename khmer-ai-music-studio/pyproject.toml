[project]
name = "khmer-ai-music-studio"
version = "0.1.0"
description = "Khmer AI Music Studio 5-in-1 — local, Suno-free song production (lyrics, music + vocals, cover, karaoke MV, publishing)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
qr = ["qrcode"]

[project.scripts]
khmer-studio = "khmer_studio.__main__:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["khmer_studio*"]

[tool.setuptools.package-data]
khmer_studio = ["fonts/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
